      - {value: lt2, label: {fr: "Moins de 2 %", en: "Less than 2%"}}
      - {value: 2to5, label: {fr: "De 2 % à moins de 5 %", en: "2% to less than 5%"}}
      - {value: 5to10, label: {fr: "De 5 % à moins de 10 %", en: "5% to less than 10%"}}
      - {value: gt10, label: {fr: "Plus de 10 %", en: "More than 10%"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}

  # ---------------------------------------------------------------- contexte
  - id: context.amount_cad
    type: money
    min: 0
    max: 100000000
    weight: 4
    summary: true
    writable_by: [base, a1]
    label: {fr: "Montant à investir", en: "Amount to invest"}
  - id: context.has_existing_portfolio
    type: boolean
    weight: 1
    writable_by: [base]
    label: {fr: "Portefeuille existant", en: "Existing portfolio"}
  - id: context.existing_portfolio_value_cad
    type: money
    min: 0
    max: 1000000000
    weight: 0
    writable_by: [a2]
    label: {fr: "Valeur du portefeuille existant", en: "Existing portfolio value"}
  - id: context.portfolio_flags
    type: multi_enum
    weight: 0
    writable_by: [a2]
    label: {fr: "Constats sur le portefeuille existant", en: "Findings on the existing portfolio"}
    values:
      - {value: concentration_single_position, label: {fr: "Une position pèse plus de 20 %", en: "One position weighs more than 20%"}}
      - {value: concentration_sector, label: {fr: "Un secteur pèse plus de 40 % des actions", en: "One sector weighs more than 40% of equities"}}
      - {value: home_bias_canada, label: {fr: "Au moins 60 % au Canada", en: "At least 60% in Canada"}}
      - {value: crypto_exposure_high, label: {fr: "Plus de 10 % en cryptoactifs", en: "More than 10% in crypto-assets"}}
      - {value: cash_heavy, label: {fr: "Plus de 30 % en encaisse", en: "More than 30% in cash"}}
      - {value: few_holdings, label: {fr: "Moins de cinq titres et aucun fonds diversifié", en: "Fewer than five securities and no diversified fund"}}
      - {value: unvalued_positions, label: {fr: "Des positions n'ont pas pu être évaluées", en: "Some positions could not be valued"}}

questions:
  # 1. Niveau de connaissances d'abord (quelques questions rapides puis une auto-évaluation).
  - id: q_kn_invest_freq
    field: knowledge.invest_frequency
    kind: single_choice
    prompt: {fr: "Au cours des trois dernières années, à quelle fréquence avez-vous fait des placements (achat ou vente de titres, de fonds ou de CPG) ?", en: "Over the last three years, how often did you invest (buying or selling securities, funds or GICs)?"}
  - id: q_kn_news
    field: knowledge.news_frequency
    kind: single_choice
    prompt: {fr: "À quelle fréquence suivez-vous l'actualité financière ou économique ?", en: "How often do you follow financial or economic news?"}
  - id: q_kn_products
    field: knowledge.products_known
    kind: multi_choice
    prompt: {fr: "Quels produits connaissez-vous assez bien pour expliquer leur fonctionnement ?", en: "Which products do you know well enough to explain how they work?"}
    help: {fr: "Cochez tout ce qui s'applique.", en: "Select all that apply."}
  - id: q_kn_quiz_diversification
    field: knowledge.quiz_diversification
    kind: single_choice
    prompt: {fr: "En général, lequel de ces placements est le plus risqué ?", en: "In general, which of these investments is the riskiest?"}
    help: {fr: "Répondez sans chercher : « Je ne sais pas » est une réponse acceptée.", en: "Answer without looking it up: “I don't know” is an accepted answer."}
    options:
      - {value: single_stock, label: {fr: "Les actions d'une seule entreprise", en: "Shares of a single company"}}
      - {value: etf, label: {fr: "Un FNB qui détient les actions de plusieurs centaines d'entreprises", en: "An ETF that holds shares of several hundred companies"}}
      - {value: same, label: {fr: "Les deux ont le même risque", en: "Both carry the same risk"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: q_kn_quiz_bond_rates
    field: knowledge.quiz_bond_rates
    kind: single_choice
    prompt: {fr: "Si les taux d'intérêt montent, qu'arrive-t-il en général au prix d'une obligation déjà émise ?", en: "If interest rates rise, what generally happens to the price of a bond already issued?"}
    options:
      - {value: rises, label: {fr: "Il monte", en: "It rises"}}
      - {value: falls, label: {fr: "Il baisse", en: "It falls"}}
      - {value: same, label: {fr: "Il reste le même", en: "It stays the same"}}
      - {value: no_link, label: {fr: "Il n'y a aucun lien entre les deux", en: "There is no link between the two"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: q_kn_self
    field: knowledge.self_assessment
    kind: single_choice
    prompt: {fr: "Comment évaluez-vous vos connaissances en placement ?", en: "How would you rate your investment knowledge?"}
    help: {fr: "Vous pourrez changer ce niveau plus tard dans les réglages.", en: "You can change this level later in the settings."}
    options:
      - {value: beginner, label: {fr: "Débutant : je découvre les placements", en: "Beginner: I am new to investing"}}
      - {value: intermediate, label: {fr: "Intermédiaire : je connais les notions de base (actions, obligations, FNB)", en: "Intermediate: I know the basics (stocks, bonds, ETFs)"}}
      - {value: advanced, label: {fr: "Avancé : je compare des produits et je comprends le risque, les frais et la fiscalité", en: "Advanced: I compare products and understand risk, fees and taxes"}}

  # 2. Objectif.
  - id: q_goal
    field: objective.goal
    kind: single_choice
    prompt: {fr: "Qu'est-ce que cet argent doit d'abord vous permettre de faire ?", en: "What should this money allow you to do first and foremost?"}
    help: {fr: "Un placement est un moyen, pas un objectif. Parfois, le bon choix est de ne pas exposer cet argent aux marchés.", en: "An investment is a means, not a goal. Sometimes the right choice is not to expose this money to the markets."}
  - id: q_project_type
    field: objective.project_type
    kind: single_choice
    when: {field: objective.goal, in: [project]}
    prompt: {fr: "De quel type de projet s'agit-il ?", en: "What kind of project is it?"}

  # 3. Horizon (bandes de l'atelier BNCD).
  - id: q_horizon
    field: horizon.horizon_band
    kind: single_choice
    prompt: {fr: "Dans combien de temps aurez-vous besoin d'une part importante de cet argent ?", en: "When will you need a significant part of this money?"}
    help: {fr: "L'horizon ne se déduit ni de l'âge ni de la tolérance au risque.", en: "The horizon cannot be inferred from age or from risk tolerance."}

  # 4. Tolérance au risque (volonté de subir des fluctuations).
  - id: q_drop_reaction
    field: risk_tolerance.drop_reaction
    kind: single_choice
    prompt: {fr: "Imaginez que votre placement perde 20 % de sa valeur en quelques mois. Que feriez-vous le plus probablement ?", en: "Imagine your investment loses 20% of its value within a few months. What would you most likely do?"}
    help: {fr: "Il n'y a pas de bonne réponse : la question mesure votre réaction, pas vos connaissances.", en: "There is no right answer: the question measures your reaction, not your knowledge."}
  - id: q_risk_attitude
    field: risk_tolerance.risk_attitude
    kind: single_choice
    prompt: {fr: "Quelle phrase vous décrit le mieux ?", en: "Which statement describes you best?"}
    options:
      - {value: stability, label: {fr: "Je veux avant tout éviter les baisses, même si le rendement est faible", en: "Above all I want to avoid drops, even if the return is low"}}
      - {value: small, label: {fr: "J'accepte de petites variations pour un rendement un peu meilleur", en: "I accept small fluctuations for a slightly better return"}}
      - {value: moderate, label: {fr: "J'accepte des variations moyennes pour un meilleur potentiel de croissance", en: "I accept moderate fluctuations for better growth potential"}}
      - {value: large, label: {fr: "J'accepte de fortes variations pour viser la croissance la plus élevée", en: "I accept large fluctuations to aim for the highest growth"}}
  - id: q_sell_threshold
    field: risk_tolerance.sell_threshold_pct
    kind: single_choice
    prompt: {fr: "Sur une année, à partir de quelle baisse de votre portefeuille seriez-vous assez inquiet pour vouloir vendre, même si votre situation n'a pas changé ?", en: "Over a year, from what drop in your portfolio would you be worried enough to want to sell, even if your situation has not changed?"}
    help: {fr: "La question porte sur ce que vous ressentiriez; ce que vous pouvez perdre est demandé à part.", en: "This is about how you would feel; what you can afford to lose is asked separately."}
    options:
      - {value: none, label: {fr: "Aucune : la moindre baisse me donnerait envie de vendre", en: "None: the slightest drop would make me want to sell"}}
      - {value: lt5, label: {fr: "Moins de 5 %", en: "Less than 5%"}}
      - {value: 5to10, label: {fr: "De 5 % à moins de 10 %", en: "5% to less than 10%"}}
      - {value: 10to20, label: {fr: "De 10 % à moins de 20 %", en: "10% to less than 20%"}}
      - {value: 20to30, label: {fr: "De 20 % à moins de 30 %", en: "20% to less than 30%"}}
      - {value: gte30, label: {fr: "30 % ou plus", en: "30% or more"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}

  # 5. Capacité à prendre du risque (capacité financière à vivre les conséquences d'une perte).
  # Les questions à choix sur un champ numérique (number, money, percent) portent, pour chaque option, un
  # identifiant de tranche (value) et, sous number, la valeur écrite dans le champ : la plus prudente de la tranche
  # (borne basse pour une réserve ou un montant, borne haute pour un besoin de liquidité). min et max documentent
  # les bornes de la tranche (max nul : sans borne haute). Le fait garde aussi la tranche choisie (band :
  # identifiant, bornes et libellé) : le résumé, profil.md, les notes et A1 citent la tranche, jamais la borne
  # seule comme si l'investisseur l'avait donnée (« moins de 1 mois », pas « 0 mois »).
  - id: q_emergency_fund
    field: risk_capacity.emergency_fund
    kind: single_choice
    prompt: {fr: "Votre fonds d'urgence couvre combien de mois de dépenses essentielles ?", en: "How many months of essential expenses does your emergency fund cover?"}
    help: {fr: "Le fonds d'urgence est l'épargne disponible rapidement, hors de ce placement.", en: "The emergency fund is savings you can reach quickly, outside this investment."}
    # Points de capacité (rules.risk.capacity.thresholds) : 0 mois = 0; 1 = 1; 3 = 3; 6 et 12 = 4.
    options:
      - {value: none, number: 0, min: 0, max: 0, label: {fr: "Aucun fonds d'urgence", en: "No emergency fund"}}
      - {value: lt1, number: 0, min: 0, max: 1, label: {fr: "Moins de 1 mois", en: "Less than 1 month"}}
      - {value: 1to3, number: 1, min: 1, max: 3, label: {fr: "De 1 à moins de 3 mois", en: "1 to less than 3 months"}}
      - {value: 3to6, number: 3, min: 3, max: 6, label: {fr: "De 3 à moins de 6 mois", en: "3 to less than 6 months"}}
      - {value: 6to12, number: 6, min: 6, max: 12, label: {fr: "De 6 à moins de 12 mois", en: "6 to less than 12 months"}}
      - {value: 12plus, number: 12, min: 12, max: null, label: {fr: "12 mois ou plus", en: "12 months or more"}}
  - id: q_income_stability
    field: risk_capacity.income_stability
    kind: single_choice
    prompt: {fr: "Comment décririez-vous la stabilité de vos revenus pour les prochaines années ?", en: "How would you describe the stability of your income over the coming years?"}
    options:
      - {value: very_stable, label: {fr: "Très stables (emploi permanent, rente garantie…)", en: "Very stable (permanent job, guaranteed pension…)"}}
      - {value: stable, label: {fr: "Plutôt stables", en: "Fairly stable"}}
      - {value: variable, label: {fr: "Variables ou incertains (travail autonome, contrats…)", en: "Variable or uncertain (self-employed, contracts…)"}}
      - {value: none, label: {fr: "Pas de revenu régulier", en: "No regular income"}}
  - id: q_employment_sector
    field: risk_capacity.employment_sector
    kind: single_choice
    prompt: {fr: "Dans quel secteur travaillez-vous ?", en: "Which sector do you work in?"}
    help: {fr: "Le nom de l'employeur n'est pas demandé. Un revenu et des placements qui dépendent du même secteur peuvent baisser en même temps.", en: "Your employer's name is not asked. Income and investments that depend on the same sector can fall at the same time."}
    options:
      - {value: technology, label: {fr: "Technologie, logiciels, semi-conducteurs", en: "Technology, software, semiconductors"}}
      - {value: finance, label: {fr: "Finance, assurance, immobilier", en: "Finance, insurance, real estate"}}
      - {value: energy, label: {fr: "Énergie, mines, ressources naturelles", en: "Energy, mining, natural resources"}}
      - {value: healthcare, label: {fr: "Santé et services sociaux", en: "Health and social services"}}
      - {value: public, label: {fr: "Fonction publique, éducation", en: "Public service, education"}}
      - {value: industry, label: {fr: "Industrie, construction, transport", en: "Manufacturing, construction, transportation"}}
      - {value: retail, label: {fr: "Commerce, services, autre", en: "Retail, services, other"}}
      - {value: unemployed, label: {fr: "Ne s'applique pas (sans emploi)", en: "Does not apply (not employed)"}}
      - {value: prefer_not, label: {fr: "Je préfère ne pas répondre", en: "I prefer not to answer"}}
  - id: q_loss_impact
    field: risk_capacity.loss_impact
    kind: single_choice
    prompt: {fr: "Si ce placement perdait le quart de sa valeur, quel effet cela aurait-il sur vos projets ?", en: "If this investment lost a quarter of its value, what effect would it have on your plans?"}
    options:
      - {value: major, label: {fr: "Je devrais changer des projets importants", en: "I would have to change major plans"}}
      - {value: some, label: {fr: "Je devrais faire quelques ajustements", en: "I would have to make some adjustments"}}
      - {value: none, label: {fr: "Aucun effet notable sur mes projets", en: "No noticeable effect on my plans"}}

  # 6. Contraintes.
  - id: q_liquidity
    field: constraints.liquidity_need
    kind: single_choice
    prompt: {fr: "Prévoyez-vous retirer une partie de cet argent au cours des 12 prochains mois ?", en: "Do you plan to withdraw part of this money in the next 12 months?"}
    options:
      - {value: none, label: {fr: "Non", en: "No"}}
      - {value: some, label: {fr: "Oui, une petite partie", en: "Yes, a small part"}}
      - {value: large, label: {fr: "Oui, une part importante", en: "Yes, a large part"}}
  - id: q_withdrawal_pct
    field: constraints.withdrawal_pct_12m
    kind: single_choice
    when: {field: constraints.liquidity_need, in: [some, large]}
    prompt: {fr: "Quelle part environ, en pourcentage du montant investi ?", en: "Roughly what share, as a percentage of the amount invested?"}
    # Besoin de liquidité : la valeur écrite est la borne haute de la tranche, la plus prudente.
    options:
      - {value: lt10, number: 10, min: 0, max: 10, label: {fr: "Moins de 10 %", en: "Less than 10%"}}
      - {value: 10to25, number: 25, min: 10, max: 25, label: {fr: "De 10 % à moins de 25 %", en: "10% to less than 25%"}}
      - {value: 25to50, number: 50, min: 25, max: 50, label: {fr: "De 25 % à moins de 50 %", en: "25% to less than 50%"}}
      - {value: 50plus, number: 100, min: 50, max: 100, label: {fr: "50 % ou plus", en: "50% or more"}}
  - id: q_accounts
    field: constraints.account_types
    kind: multi_choice
    prompt: {fr: "Dans quels types de comptes cet argent sera-t-il placé ?", en: "In which types of accounts will this money be invested?"}
    help: {fr: "Les comptes enregistrés (CELI, REER, REEE, FERR) ont des règles fiscales et des plafonds propres.", en: "Registered accounts (TFSA, RRSP, RESP, RRIF) have their own tax rules and limits."}
  - id: q_currency
    field: constraints.currency_preference
    kind: single_choice
    prompt: {fr: "Quelle est votre préférence de devise pour vos placements ?", en: "What is your currency preference for your investments?"}

  # 7. Préférences (elles orientent les choix à l'intérieur des limites fixées par les contraintes).
  - id: q_esg
    field: preferences.esg_importance
    kind: scale
    prompt: {fr: "Quelle importance accordez-vous aux critères environnementaux, sociaux et de gouvernance (ESG) ?", en: "How important are environmental, social and governance (ESG) criteria to you?"}
    help: {fr: "1 = aucune importance, 5 = très grande importance.", en: "1 = not important at all, 5 = very important."}
  - id: q_exclusions
    field: preferences.exclusions
    kind: multi_choice
    when: {field: preferences.esg_importance, gte: 3}
    prompt: {fr: "Y a-t-il des secteurs que vous voulez exclure ?", en: "Are there sectors you want to exclude?"}
  - id: q_exclusion_strictness
    field: preferences.exclusion_strictness
    kind: single_choice
    when: {field: preferences.exclusions, not_in: [[], [none]]}
    prompt: {fr: "Pour ces exclusions, prises ensemble : s'agit-il d'une limite absolue, d'une limite qui tolère une très petite part dans un fonds diversifié, ou d'une préférence ?", en: "For these exclusions, taken together: is it an absolute limit, a limit that tolerates a very small share in a diversified fund, or a preference?"}
    help: {fr: "Un fonds indiciel large contient presque toujours un peu de chaque secteur.", en: "A broad index fund almost always holds a little of every sector."}
    options:
      - {value: absolute, label: {fr: "Limite absolue : jamais, même indirectement", en: "Absolute limit: never, not even indirectly"}}
      - {value: small_share_in_fund, label: {fr: "Limite, mais une très petite part dans un fonds diversifié est acceptable", en: "A limit, but a very small share in a diversified fund is acceptable"}}
      - {value: preference, label: {fr: "Préférence : en avoir moins si possible", en: "Preference: hold less of them when possible"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: q_interests
    field: preferences.interests
    kind: multi_choice
    prompt: {fr: "Certains thèmes vous intéressent-ils particulièrement ?", en: "Are you particularly interested in some themes?"}
  - id: q_crypto_place
    field: preferences.crypto_place
    kind: single_choice
    when: {field: preferences.interests, contains: crypto}
    prompt: {fr: "Quelle place souhaitez-vous donner aux cryptoactifs (par exemple le bitcoin) dans votre portefeuille ?", en: "What place do you want to give crypto-assets (for example bitcoin) in your portfolio?"}
    help: {fr: "C'est une préférence, pas une mesure de votre tolérance au risque.", en: "This is a preference, not a measure of your risk tolerance."}
    options:
      - {value: none, label: {fr: "Aucune : je n'en veux pas", en: "None: I don't want any"}}
      - {value: small, label: {fr: "Une petite part, pour essayer", en: "A small share, to try"}}
      - {value: larger, label: {fr: "Une part plus importante", en: "A larger share"}}
      - {value: let_system_decide, label: {fr: "Pas d'avis : laissez le système décider dans mes limites", en: "No opinion: let the system decide within my limits"}}
      - {value: dont_know, label: {fr: "Je ne sais pas ce que c'est", en: "I don't know what they are"}}
  - id: q_crypto_max
    field: preferences.crypto_max_pct
    kind: single_choice
    when: {field: preferences.crypto_place, in: [small, larger]}
    prompt: {fr: "Au maximum, quelle part de votre portefeuille voulez-vous en cryptoactifs ?", en: "At most, what share of your portfolio do you want in crypto-assets?"}
  - id: q_favored_tickers
    field: preferences.favored_tickers
    kind: multi_choice
    when: {field: knowledge.products_known, contains: stocks}
    prompt: {fr: "Y a-t-il des entreprises de cette liste que vous aimeriez voir dans votre portefeuille ?", en: "Are there companies on this list you would like to see in your portfolio?"}
    help: {fr: "C'est une préférence : elle compte dans le choix des titres, mais ne passe jamais avant vos limites de risque.", en: "This is a preference: it counts when securities are chosen, but never ahead of your risk limits."}

  # 8. Comportement : une mise en situation, puis sa relance si l'investisseur achèterait.
  - id: q_hype_reaction
    field: behavior.hype_reaction
    kind: single_choice
    prompt: {fr: "Une entreprise dont tout le monde parle a vu son action monter de 60 % en trois mois. Elle ne fait pas partie de votre plan. Que faites-vous ?", en: "A company everyone is talking about has seen its stock rise 60% in three months. It is not part of your plan. What do you do?"}
    help: {fr: "Il n'y a pas de bonne réponse : la question mesure votre réaction, pas vos connaissances.", en: "There is no right answer: the question measures your reaction, not your knowledge."}
    options:
      - {value: buy_a_lot, label: {fr: "J'en achète une part importante", en: "I buy a large amount"}}
      - {value: buy_some, label: {fr: "J'en achète un peu", en: "I buy a little"}}
      - {value: wait, label: {fr: "J'attends d'en savoir plus avant de décider", en: "I wait to learn more before deciding"}}
      - {value: no_change, label: {fr: "Je ne change rien à mon plan", en: "I don't change my plan"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: q_hype_share
    field: behavior.hype_position_share
    kind: single_choice
    when: {field: behavior.hype_reaction, in: [buy_a_lot, buy_some]}
    prompt: {fr: "Dans cette situation, quelle part de votre portefeuille mettriez-vous dans cette action ?", en: "In that situation, what share of your portfolio would you put in this stock?"}

  # 9. Contexte, puis le portefeuille existant en dernier.
  - id: q_amount
    field: context.amount_cad
    kind: single_choice
    prompt: {fr: "Quel montant pensez-vous investir, en dollars canadiens ?", en: "How much do you plan to invest, in Canadian dollars?"}
    help: {fr: "Un ordre de grandeur suffit. Le profil reste fictif : n'indiquez aucun renseignement bancaire.", en: "A rough figure is enough. The profile stays fictitious: do not enter any banking details."}
    # Tranches de SF-00 (banque du Brain). Valeur écrite = borne basse, qui garde les pertes en dollars prudentes;
    # sous 10 000 $, la borne basse (0) ne permettrait aucun calcul en dollars : 5 000 $, le milieu de la tranche.
    # « Je ne sais pas » vaut 10 000 $, comme SF-00.
    options:
      - {value: lt10k, number: 5000, min: 0, max: 10000, label: {fr: "Moins de 10 000 $", en: "Less than $10,000"}}
      - {value: 10k_50k, number: 10000, min: 10000, max: 50000, label: {fr: "De 10 000 $ à moins de 50 000 $", en: "$10,000 to less than $50,000"}}
      - {value: 50k_150k, number: 50000, min: 50000, max: 150000, label: {fr: "De 50 000 $ à moins de 150 000 $", en: "$50,000 to less than $150,000"}}
      - {value: 150k_500k, number: 150000, min: 150000, max: 500000, label: {fr: "De 150 000 $ à moins de 500 000 $", en: "$150,000 to less than $500,000"}}
      - {value: 500k_plus, number: 500000, min: 500000, max: null, label: {fr: "500 000 $ ou plus", en: "$500,000 or more"}}
      - {value: unknown, number: 10000, label: {fr: "Je ne sais pas (10 000 $ retenus)", en: "I don't know ($10,000 used)"}}
  - id: q_existing_portfolio
    field: context.has_existing_portfolio
    kind: boolean
    prompt: {fr: "Avez-vous un portefeuille existant que vous aimeriez faire analyser ?", en: "Do you have an existing portfolio you would like analysed?"}
    help: {fr: "Vous pourrez le fournir sous n'importe quelle forme : texte collé, CSV, tableur, PDF ou capture d'écran.", en: "You can provide it in any form: pasted text, CSV, spreadsheet, PDF or screenshot."}

rules:
  knowledge_level:
    # total = points de fréquence des placements + points du suivi de l'actualité + points des produits (0 à 9).
    # Niveau mesuré : débutant de 0 à 2, intermédiaire de 3 à 5, avancé de 6 à 9.
    # Niveau retenu = min(auto-évaluation, niveau mesuré + 1 cran) : l'auto-évaluation peut dépasser le niveau
    # mesuré d'un cran au plus; une auto-évaluation plus modeste que le niveau mesuré est respectée.
    points:
      knowledge.invest_frequency: {never: 0, rarely: 1, several_per_year: 2, monthly: 3}
      knowledge.news_frequency: {rarely: 0, monthly: 1, weekly: 2, daily: 3}
    products:
      # 0 produit de base : 0 point; 1 ou 2 : 1 point; 3 ou 4 : 2 points; 3 ou plus et un produit avancé : 3 points.
      core: [mutual_funds, etf, stocks, bonds]
      advanced: [options]
    bands: {beginner: 0, intermediate: 3, advanced: 6}
    self_assessment_margin: 1
  risk:
    levels: [low, low_medium, medium, medium_high, high]
    # Libellés au féminin pour la tolérance et la capacité, au masculin pour le risque effectif.
    level_labels:
      low: {fr: "Faible", en: "Low"}
      low_medium: {fr: "Faible à moyenne", en: "Low to medium"}
      medium: {fr: "Moyenne", en: "Medium"}
      medium_high: {fr: "Moyenne à élevée", en: "Medium to high"}
      high: {fr: "Élevée", en: "High"}
    effective_labels:
      low: {fr: "Faible", en: "Low"}
      low_medium: {fr: "Faible à moyen", en: "Low to medium"}
      medium: {fr: "Moyen", en: "Medium"}
      medium_high: {fr: "Moyen à élevé", en: "Medium to high"}
      high: {fr: "Élevé", en: "High"}
    tolerance:
      # Tolérance = partie entière de la moyenne des points connus (0 à 4); la réaction à une baisse réelle
      # compte quand A1 l'a apprise et que l'investisseur l'a vécue.
      required: [risk_tolerance.drop_reaction, risk_tolerance.risk_attitude]
      points:
        risk_tolerance.drop_reaction: {sell_all: 0, sell_some: 1, hold: 3, buy_more: 4}
        risk_tolerance.risk_attitude: {stability: 0, small: 1, moderate: 2, large: 4}
        risk_tolerance.past_drop_behavior: {sold: 0, held: 3, bought_more: 4}
    capacity:
      # Capacité = partie entière de la moyenne des trois composantes (0 à 4), puis plafonnée :
      # un horizon court, un besoin de liquidité, un impact majeur d'une perte ou une dette coûteuse la limitent.
      required: [risk_capacity.emergency_fund, risk_capacity.income_stability, risk_capacity.loss_impact, horizon.horizon_band]
      points:
        risk_capacity.income_stability: {very_stable: 4, stable: 3, variable: 1, none: 0}
        risk_capacity.loss_impact: {major: 0, some: 2, none: 4}
      thresholds:
        # [mois minimum, points] : 0 mois = 0; moins de 3 mois = 1; de 3 à moins de 6 = 3; 6 mois et plus = 4.
        risk_capacity.emergency_fund: [[0, 0], [0.5, 1], [3, 3], [6, 4]]
      caps:
        horizon.horizon_band: {lt3: 1, 3to10: 3}
        constraints.liquidity_need: {some: 3, large: 1}
        risk_capacity.loss_impact: {major: 1}
        risk_capacity.high_interest_debt: {"true": 2}
    # Risque effectif = min(tolérance, capacité), sur l'échelle levels (0 = low ... 4 = high).
