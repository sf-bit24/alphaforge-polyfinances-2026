      - {value: healthcare, label: {fr: "Santé", en: "Health care"}}
      - {value: clean_energy, label: {fr: "Énergie propre", en: "Clean energy"}}
      - {value: gold, label: {fr: "Or", en: "Gold"}}
      - {value: none, label: {fr: "Aucun thème en particulier", en: "No particular theme"}}
  # Banque du Brain PR-02 et PR-13 : posées seulement si les cryptoactifs sont un thème d'intérêt.
  - id: preferences.crypto_place
    type: enum
    weight: 0
