      - {value: CSU.TO, label: {fr: "Constellation Software (CSU.TO)", en: "Constellation Software (CSU.TO)"}}
      - {value: AAPL, label: {fr: "Apple (AAPL)", en: "Apple (AAPL)"}}
      - {value: MSFT, label: {fr: "Microsoft (MSFT)", en: "Microsoft (MSFT)"}}
      - {value: NVDA, label: {fr: "NVIDIA (NVDA)", en: "NVIDIA (NVDA)"}}
      - {value: GOOGL, label: {fr: "Alphabet, classe A (GOOGL)", en: "Alphabet, Class A (GOOGL)"}}
