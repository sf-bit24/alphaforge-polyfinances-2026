# Robert - era 1 (long history, USD proxies, 1926+). SIMULATION ONLY - not financial advice.
# Persona inputs used (profil-investisseur-robert.md, identity/RRTTLLU only): 59 y, near retirement,
# horizon 3-5 y (central 4 y), low-to-moderate risk (capacity < tolerance), objective = preserve capital
# with moderate growth, prefers established companies, no crypto. NO allocation / threshold from the doc.
#
# HYPOTHESIS (declared): a Canadian retiree before 1971 is approximated by a USD investor in US proxies
# (no free USDCAD before 1971-02; Canadian equities start 1977-01). Real returns use US CPI-U.
#
# Thresholds are DERIVED in analysis/robert/derive_thresholds.py (trace results/robert_analysis/
# derive_thresholds.json): rule "longest nominal underwater period of the boundary static mix <= horizon";
# for H = 4 y the most conservative era (USD 1926+) gives maxDD* = 0.227 and monthly CVaR5* = 0.036
# (boundary mix 20 % US_MKT / 80 % UST_10Y). Rounded to 0.23 / 0.036. PROPOSAL TO BE VALIDATED BY THE TEAM.
# max_vol is left null on purpose: volatility is symmetric, Robert's capacity is about losses.

id: robert_usd_gold
description: "Robert sensitivity: USD proxies 1975+ with GOLD (investable since 1975-01), same derived limits."
currency: USD
fx_fill: none
horizon_years: 4
mode: non_overlapping
step_months: 12
period: {start: 1975-01, end: null}

universe: [US_MKT, US_IND_NODUR, US_IND_UTILS, US_IND_HLTH, CORP_AAA, UST_20Y, UST_10Y, UST_5Y, UST_2Y, GOLD, UST_TBILL]
cash_asset: UST_TBILL

objective:
  # Score = annualised real return - 0 ; robust selection maximises its 10th percentile across windows,
  # shortfall_prob = probability of a REAL loss over the window (capital preservation in purchasing power).
  type: min_shortfall
  target_real_return: 0.0

constraints:
  default_bounds: [0.0, 1.0]
  exclude: {assets: [], tags: [crypto, speculative], classes: [crypto]}
  groups: []

risk_limits:
  max_vol: null
  max_drawdown: 0.23
  max_cvar_5: 0.036

flows: {initial: 1.0, monthly: 0.0, indexed_to_inflation: true}
rebalancing: {frequency: annual, band: 0.05}
costs_bps: 10
fallback_weights: {US_MKT: 0.2, UST_5Y: 0.6, UST_TBILL: 0.2}

strategies:
  - {name: cash_100, type: static, params: {weights: {UST_TBILL: 1.0}}}
  - {name: ladder_tbill_2y, type: static, params: {weights: {UST_TBILL: 0.5, UST_2Y: 0.5}}}
  - {name: bonds_5y, type: static, params: {weights: {UST_5Y: 1.0}}}
  - {name: bonds_20y, type: static, params: {weights: {UST_20Y: 1.0}}}
  - {name: eq10_5y, type: static, params: {weights: {US_MKT: 0.1, UST_5Y: 0.9}}}
  - {name: eq20_5y, type: static, params: {weights: {US_MKT: 0.2, UST_5Y: 0.8}}}
  - {name: eq20_2y, type: static, params: {weights: {US_MKT: 0.2, UST_2Y: 0.8}}}
  - {name: eq20_10y, type: static, params: {weights: {US_MKT: 0.2, UST_10Y: 0.8}}}
  - {name: eq20_20y, type: static, params: {weights: {US_MKT: 0.2, UST_20Y: 0.8}}}
  - {name: eq30_barbell, type: static, params: {weights: {US_MKT: 0.3, UST_5Y: 0.4, UST_TBILL: 0.3}}}
  - {name: eq30_defensive, type: static,
     params: {weights: {US_MKT: 0.1, US_IND_NODUR: 0.1, US_IND_UTILS: 0.05, US_IND_HLTH: 0.05, UST_5Y: 0.4, UST_2Y: 0.2, UST_TBILL: 0.1}}}
  - {name: eq20_gold10, type: static, params: {weights: {US_MKT: 0.2, GOLD: 0.1, UST_5Y: 0.5, UST_2Y: 0.2}}}
  - {name: eq40_5y, type: static, params: {weights: {US_MKT: 0.4, UST_5Y: 0.6}}}
  - {name: sixty_forty, type: sixty_forty, params: {equity: [US_MKT], bonds: [UST_10Y], equity_share: 0.6}}
  - name: glide_40_to_10
    type: glidepath
    params:
      start_weights: {US_MKT: 0.4, UST_5Y: 0.6}
      end_weights: {US_MKT: 0.1, UST_2Y: 0.5, UST_TBILL: 0.4}
  - {name: risk_parity_36m, type: risk_parity, params: {lookback: 36, method: inverse_vol, exclude: [UST_TBILL]}}
  - {name: min_variance_60m, type: min_variance, params: {lookback: 60}}
  - {name: mean_variance_60m, type: mean_variance, params: {lookback: 60, mu_shrink: 0.5, risk_aversion: 10}}
  - name: trend_40_5y
    type: trend_filter
    params: {ma_months: 10, base_weights: {US_MKT: 0.4, UST_5Y: 0.6}, always_hold: [UST_5Y]}
    rebalancing: {frequency: monthly}
  - name: trend_30_defensive
    type: trend_filter
    params: {ma_months: 10, base_weights: {US_MKT: 0.1, US_IND_NODUR: 0.1, US_IND_UTILS: 0.05, US_IND_HLTH: 0.05, UST_5Y: 0.4, UST_2Y: 0.2, UST_TBILL: 0.1}, always_hold: [UST_2Y]}
    rebalancing: {frequency: monthly}
  - name: momentum_core2y
    type: momentum
    params: {lookback: 12, top_k: 2, absolute: true, core_weights: {UST_2Y: 0.5},
             candidates: [US_MKT, US_IND_NODUR, US_IND_UTILS, US_IND_HLTH, UST_5Y, UST_10Y, CORP_AAA, GOLD]}
    rebalancing: {frequency: monthly}

selection:
  quantile: 0.10
  max_breach_rate: 0.10     # a strategy breaching the derived loss limits in > 1 window out of 10 is not eligible
  min_past_windows: 3

oracle: {enabled: true, n_starts: 6}
seed: 42
