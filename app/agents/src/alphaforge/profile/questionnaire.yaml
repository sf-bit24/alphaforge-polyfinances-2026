      kind: single_choice
      prompt: {fr: "Comment préférez-vous investir ?", en: "How do you prefer to invest?"}

  # ---------------------------------------------------------------- comportement
  # Banque du Brain CB-01 et CB-04. Lu par l'étape 0 (FOMO et achat par attention, strategy.yaml,
  # profile_codes.fomo_* et attention_*) : un garde-fou, jamais une allocation.
  - id: behavior.hype_reaction
    type: enum
    weight: 0
    writable_by: [base, a1]
    label: {fr: "Réaction à une action très médiatisée, en hausse de 60 %", en: "Reaction to a much-talked-about stock up 60%"}
    values:
      - {value: buy_a_lot, label: {fr: "En acheter beaucoup", en: "Buy a lot"}}
      - {value: buy_some, label: {fr: "En acheter un peu", en: "Buy a little"}}
      - {value: wait, label: {fr: "Attendre", en: "Wait"}}
      - {value: no_change, label: {fr: "Ne rien changer", en: "Change nothing"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: behavior.hype_position_share
