      - {value: JPM, label: {fr: "JPMorgan Chase (JPM)", en: "JPMorgan Chase (JPM)"}}
      - {value: JNJ, label: {fr: "Johnson & Johnson (JNJ)", en: "Johnson & Johnson (JNJ)"}}
