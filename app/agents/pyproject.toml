[project]
name = "alphaforge-agents"
version = "0.1.0"
description = "Runtimes AgentCore d'AlphaForge AI : profil (A1, A2) et collecte (A4, A5, A6)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "strands-agents==1.65.0",
    "bedrock-agentcore==1.26.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
# Volet finance (F2-F4 : optimiseur, analyses, contrôle du Judge ; rejeu LLM ; traçabilité).
# Hors des dépendances de base tant que le runtime A3/Judge n'est pas déployé (taille du zip AgentCore).
finance = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyarrow>=17",
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "pydantic>=2.9",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "requests>=2.32",
]
# Reconstruction des données longues du moteur de backtest seulement (python -m alphaforge.finance.backtest.build_data) :
# yfinance (historique des tickers avant le jeu de départ), xlrd (Shiller ie_data.xls), openpyxl (classeurs .xlsx).
# Jamais nécessaire pour simuler ni pour les tests (les parquets reconstruits ne sont pas versionnés).
backtest-data = [
    "yfinance>=0.2.54",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.5",
]
dev = [
    "botocore[crt]>=1.44.3",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Volet B (scénarios probabilistes) : job de précalcul (local ou SageMaker Processing) et ses tests.
# Groupe optionnel, hors du paquet AgentCore (package.sh exporte --no-dev sans ce groupe) : le runtime ne lit que
# les tables précalculées. Installation : uv sync --group scenarios. Image SageMaker (Python 3.12) :
# src/alphaforge/scenarios/requirements-job.txt (versions épinglées, y compris alphaforge.finance.backtest.build_data).
scenarios = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Avertissements internes de bedrock-agentcore 1.26.0 (pydantic class Config, datetime.utcnow).
    "ignore::DeprecationWarning:bedrock_agentcore.*",
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E, F, I, B, UP, S : socle. Les familles suivantes portent les règles de code propre du projet :
#   N                 nommage PEP 8 (snake_case, CapWords, exceptions en ...Error)
#   C90               complexité cyclomatique d'une fonction (mccabe)
#   PLR0912/0913/0915 branches, arguments et instructions par fonction
#   FBT001/FBT002     pas d'argument booléen positionnel (argument drapeau)
#   SIM, RET, C4, PIE simplifications ; ERA code commenté ; RUF100 noqa devenus inutiles
select = [
    "E", "F", "I", "B", "UP", "S",
    "N", "C90", "PLR0912", "PLR0913", "PLR0915", "FBT001", "FBT002", "SIM", "RET", "C4", "PIE", "ERA", "RUF100",
]
ignore = ["S101", "S311"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 30

[tool.ruff.lint.per-file-ignores]
# Les tests gardent le socle (E, F, I, UP) : les règles de code propre visent le code de production.
"tests/**" = ["S", "B", "N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
# Scripts de calibration : pièces de recherche figées, citées par risk_levels.yaml comme source des seuils.
# Ils ne tournent qu'avec les données longues ; les réécrire sans pouvoir les rejouer changerait la preuve.
"scripts/calibration/**" = ["N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
# En attente : code pas encore mis aux règles de code propre (from_profile_view.py : PR #69).
# À refaire dans une PR suivante ; retirer la ligne d'un fichier une fois refait.
"src/alphaforge/finance/debate/**" = ["N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
"src/alphaforge/finance/policy/from_profile_view.py" = ["N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
"src/alphaforge/finance/strategy/**" = ["N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
"src/alphaforge/portfolio_service.py" = ["N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
"scripts/finance/export_web_fixtures.py" = ["N", "C90", "PLR09", "FBT", "SIM", "RET", "C4", "PIE", "ERA", "RUF100"]
# Les tests du moteur appellent pytest.importorskip (numpy, pandas, scipy) avant leurs imports, pour sauter proprement
# quand le groupe finance n'est pas installé (CI : uv sync --frozen).
"tests/finance/backtest/**" = ["E402"]
# Registre des sources : adresses complètes des points d'accès, plus longues que la ligne.
"src/alphaforge/research/packs.py" = ["E501"]
