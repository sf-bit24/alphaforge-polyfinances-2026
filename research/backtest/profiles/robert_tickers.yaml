# Robert - verification of the retained proxy strategy translated into REAL starter tickers, 2021-11..2026-09
# (CAD, Canadian CPI; CA inflation and CA_TBILL end 2026-09). SIMULATION ONLY - not financial advice.
# Translation (data/processed/assets.csv universe_tickers / proxy_for_ticker):
#   CA_EQ -> XIU.TO ; US_MKT -> SPY ; GOLD -> GLD ; CA_GOV_10Y -> XBB.TO (approx: universe index incl. provincials/corporates, assets.csv)
#   CA_TBILL -> ZST.TO (ultra-short ETF; correlation with CA_TBILL only 0.49, README) ; UST_20Y -> TLT ; UST_5Y -> AGG (approx)
#   US_IND_NODUR -> PG ; US_IND_UTILS -> FTS.TO ; US_IND_HLTH -> JNJ
# Same derived limits as robert_cad.yaml (maxDD* 0.23, CVaR5* 0.036). Horizon 59 months = whole real period.

id: robert_tickers
description: "Robert - retained strategy in real tickers, real period 2021-11..2026-09 (CAD)."
currency: CAD
fx_fill: none
horizon_years: 4.9167
mode: non_overlapping
step_months: 12
period: {start: 2021-11, end: 2026-09}

universe: [XIU.TO, SPY, GLD, XBB.TO, ZST.TO, AGG, TLT, PG, FTS.TO, JNJ, RY.TO, CA_TBILL]
cash_asset: CA_TBILL

objective: {type: min_shortfall, target_real_return: 0.0}
constraints:
  default_bounds: [0.0, 1.0]
  exclude: {assets: [], tags: [crypto, speculative], classes: [crypto]}
  groups: []
risk_limits: {max_vol: null, max_drawdown: 0.23, max_cvar_5: 0.036}
flows: {initial: 1.0, monthly: 0.0, indexed_to_inflation: true}
rebalancing: {frequency: annual, band: 0.05}
costs_bps: 10

strategies:
  - {name: retained_eq20_gold10, type: static, params: {weights: {XIU.TO: 0.1, SPY: 0.1, GLD: 0.1, XBB.TO: 0.5, ZST.TO: 0.2}}}
  - {name: retained_cash_proxy, type: static, params: {weights: {XIU.TO: 0.1, SPY: 0.1, GLD: 0.1, XBB.TO: 0.5, CA_TBILL: 0.2}}}
  - {name: retained_shorter, type: static, params: {weights: {XIU.TO: 0.1, SPY: 0.1, GLD: 0.1, XBB.TO: 0.3, ZST.TO: 0.4}}}
  - {name: eq20_no_gold, type: static, params: {weights: {XIU.TO: 0.1, SPY: 0.1, XBB.TO: 0.57, ZST.TO: 0.23}}}
  - {name: eq20_gold10_agg, type: static, params: {weights: {XIU.TO: 0.1, SPY: 0.1, GLD: 0.1, AGG: 0.5, ZST.TO: 0.2}}}
  - {name: eq20_gold10_tlt, type: static, params: {weights: {XIU.TO: 0.1, SPY: 0.1, GLD: 0.1, TLT: 0.5, ZST.TO: 0.2}}}
  - {name: eq30_defensive_tickers, type: static,
     params: {weights: {XIU.TO: 0.1, PG: 0.075, FTS.TO: 0.05, JNJ: 0.075, XBB.TO: 0.5, ZST.TO: 0.2}}}
  - {name: sixty_forty_tickers, type: static, params: {weights: {XIU.TO: 0.3, SPY: 0.3, XBB.TO: 0.4}}}
  - {name: cash_zst, type: static, params: {weights: {ZST.TO: 1.0}}}

selection: {quantile: 0.10, max_breach_rate: 0.10, min_past_windows: 3}
oracle: {enabled: true, n_starts: 6}
seed: 42
