# À RELIRE PAR LE VOLET FINANCE DE L'ÉQUIPE LARPATHON.
#
# Questionnaire déterministe d'AlphaForge AI (aucun modèle) : questions de base, champs du profil,
# poids de complétude, règle du niveau de connaissances et correspondance du risque effectif.
# Le code (alphaforge.profile.questionnaire et alphaforge.profile.rules) lit ce fichier tel quel;
# changer un texte, une option, un poids ou un barème ne demande aucun changement de code.
#
# Repères : atelier BNCD « Comprendre l'investisseur avant de bâtir la solution » (objectifs, diapositive 3;
# horizon < 3 ans, 3 à 10 ans, 10 ans et plus, qui ne se déduit ni de l'âge ni de la tolérance, diapositive 7;
# tolérance au risque différente de la capacité, diapositive 8; profil en cinq dimensions, diapositive 10;
# ce qu'un portefeuille ne dit pas, diapositive 14) et énoncé officiel (cadre responsable, p. 14 et 17).
# Les fiches des personas ne fournissent aucun chiffre ni barème à ce fichier.

version: "2026-11-15.2"
review: "À relire par le volet finance de l'équipe larpathon : textes, options, poids et barèmes."

completeness:
  # score = somme des poids des champs applicables connus / somme des poids des champs applicables.
  # Un champ dont la condition « when » est fausse n'est pas applicable et sort du calcul.
  # Les questions de base donnent environ 0,65; les relances d'A1 complètent le profil.
  # Les variables du profil court lues par l'étape 0 de la finance (quiz, seuil de vente, secteur d'emploi,
  # force des exclusions, cryptoactifs, comportement) ont un poids de 0 : posées dans le parcours de base,
  # elles ne comptent pas dans la complétude et ne déplacent ni le seuil ni les relances d'A1 (missing_fields).
  threshold: 0.70
  cap: 0.95

followups:
  # Version courte décidée par l'équipe (Brain, product/questionnaire-profil.md, « Version courte et choix de
  # réponses ») : des choix de réponses chaque fois que c'est possible, une question ouverte en exception.
  # max_generated : questions générées par A1 dans une session (les questions de secours fb_ et de
  #   confirmation cf_ ne comptent pas).
  # max_open_questions : questions ouvertes (genre text) par session, toutes sources confondues.
  # open_fields : seuls champs qu'une question ouverte peut viser; une question ouverte sans champ (field nul)
  #   est une question d'exploration.
  max_generated: 8
  max_open_questions: 2
  open_fields: [objective.goal_detail]

fields:
  # ---------------------------------------------------------------- niveau de connaissances
  - id: knowledge.invest_frequency
    type: enum
    weight: 0
    writable_by: [base]
    label: {fr: "Fréquence des placements (3 dernières années)", en: "Investing frequency (last 3 years)"}
    values:
      - {value: never, label: {fr: "Jamais", en: "Never"}}
      - {value: rarely, label: {fr: "Une ou deux fois", en: "Once or twice"}}
      - {value: several_per_year, label: {fr: "Plusieurs fois par année", en: "Several times a year"}}
      - {value: monthly, label: {fr: "Tous les mois ou plus souvent", en: "Every month or more often"}}
  - id: knowledge.news_frequency
    type: enum
    weight: 0
    writable_by: [base]
    label: {fr: "Suivi de l'actualité financière", en: "Following financial news"}
    values:
      - {value: rarely, label: {fr: "Rarement ou jamais", en: "Rarely or never"}}
      - {value: monthly, label: {fr: "Quelques fois par mois", en: "A few times a month"}}
      - {value: weekly, label: {fr: "Chaque semaine", en: "Every week"}}
      - {value: daily, label: {fr: "Tous les jours", en: "Every day"}}
  - id: knowledge.products_known
    type: multi_enum
    weight: 0
    writable_by: [base]
    exclusive: [none]
    label: {fr: "Produits connus", en: "Products known"}
    values:
      - {value: savings_gic, label: {fr: "Compte d'épargne ou CPG", en: "Savings account or GIC"}}
      - {value: mutual_funds, label: {fr: "Fonds communs de placement", en: "Mutual funds"}}
      - {value: etf, label: {fr: "FNB (fonds négociés en bourse)", en: "ETFs (exchange-traded funds)"}}
      - {value: stocks, label: {fr: "Actions", en: "Stocks"}}
      - {value: bonds, label: {fr: "Obligations", en: "Bonds"}}
      - {value: options, label: {fr: "Options ou autres dérivés", en: "Options or other derivatives"}}
      - {value: crypto, label: {fr: "Cryptoactifs", en: "Crypto-assets"}}
      - {value: none, label: {fr: "Aucun de ces produits", en: "None of these"}}
  # Mini-quiz (banque du Brain CN-03 et CN-04), lu par l'étape 0 : une auto-évaluation « avancé » avec une
  # réponse fausse ou « je ne sais pas » signale un excès de confiance (strategy.yaml, profile_codes.quiz_correct).
  # Il ne change pas le barème du niveau de connaissances (rules.knowledge_level).
  - id: knowledge.quiz_diversification
    type: enum
    weight: 0
    writable_by: [base]
    label: {fr: "Quiz : une action seule ou un FNB, lequel est le plus risqué", en: "Quiz: a single stock or an ETF, which is riskier"}
    values:
      - {value: single_stock, label: {fr: "Une action seule", en: "A single stock"}}
      - {value: etf, label: {fr: "Un FNB", en: "An ETF"}}
      - {value: same, label: {fr: "Le même risque", en: "The same risk"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: knowledge.quiz_bond_rates
    type: enum
    weight: 0
    writable_by: [base]
    label: {fr: "Quiz : effet d'une hausse des taux sur le prix d'une obligation", en: "Quiz: effect of rising rates on a bond's price"}
    values:
      - {value: rises, label: {fr: "Il monte", en: "It rises"}}
      - {value: falls, label: {fr: "Il baisse", en: "It falls"}}
      - {value: same, label: {fr: "Il reste le même", en: "It stays the same"}}
      - {value: no_link, label: {fr: "Aucun lien", en: "No link"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: knowledge.self_assessment
    type: enum
    weight: 0
    writable_by: [base, a1]
    label: {fr: "Auto-évaluation des connaissances", en: "Self-assessed knowledge"}
    values:
      - {value: beginner, label: {fr: "Débutant", en: "Beginner"}}
      - {value: intermediate, label: {fr: "Intermédiaire", en: "Intermediate"}}
      - {value: advanced, label: {fr: "Avancé", en: "Advanced"}}
  - id: knowledge.level
    type: enum
    weight: 5
    computed: true   # calculé par rules.knowledge_level, ou fixé dans les réglages (provenance settings)
    writable_by: [settings]
    label: {fr: "Niveau de connaissances", en: "Knowledge level"}
    values:
      - {value: beginner, label: {fr: "Débutant", en: "Beginner"}}
      - {value: intermediate, label: {fr: "Intermédiaire", en: "Intermediate"}}
      - {value: advanced, label: {fr: "Avancé", en: "Advanced"}}

  # ---------------------------------------------------------------- objectif
  - id: objective.goal
    type: enum
    weight: 10
    summary: true
    writable_by: [base, a1]
    label: {fr: "Objectif principal", en: "Main goal"}
    values:
      - {value: growth, label: {fr: "Faire croître le capital à long terme", en: "Grow capital over the long term"}}
      - {value: retirement, label: {fr: "Préparer la retraite", en: "Prepare for retirement"}}
      - {value: project, label: {fr: "Financer un projet important", en: "Fund a major project"}}
      - {value: income, label: {fr: "Générer un revenu régulier", en: "Generate a regular income"}}
      - {value: preservation, label: {fr: "Préserver le capital en gardant un potentiel de croissance", en: "Preserve capital while keeping some growth potential"}}
      - {value: legacy, label: {fr: "Transmettre un patrimoine", en: "Pass on wealth"}}
      - {value: safety_cushion, label: {fr: "Constituer un coussin de sécurité", en: "Build a safety cushion"}}
  - id: objective.project_type
    type: enum
    weight: 2
    summary: true
    when: {field: objective.goal, in: [project]}
    writable_by: [base, a1]
    label: {fr: "Type de projet", en: "Type of project"}
    values:
      - {value: home, label: {fr: "Achat d'une propriété", en: "Buying a home"}}
      - {value: education, label: {fr: "Études", en: "Education"}}
      - {value: business, label: {fr: "Lancer ou financer une entreprise", en: "Starting or funding a business"}}
      - {value: travel, label: {fr: "Voyage ou année sabbatique", en: "Travel or sabbatical"}}
      - {value: other, label: {fr: "Autre projet", en: "Other project"}}
  - id: objective.goal_detail
    type: text
    max_length: 500
    weight: 6
    writable_by: [a1]
    label: {fr: "Précision de l'objectif", en: "Goal details"}
    fallback:
      kind: text
      prompt: {fr: "En une ou deux phrases, que voulez-vous concrètement accomplir avec cet argent ?", en: "In one or two sentences, what do you concretely want this money to achieve?"}
      help: {fr: "Par exemple : une mise de fonds dans cinq ans, un complément de revenu à la retraite.", en: "For example: a down payment in five years, extra income in retirement."}

  # ---------------------------------------------------------------- horizon
  - id: horizon.horizon_band
    type: enum
    weight: 10
    summary: true
    writable_by: [base, a1]
    label: {fr: "Horizon de placement", en: "Investment horizon"}
    values:
      - {value: lt3, label: {fr: "Moins de 3 ans", en: "Less than 3 years"}}
      - {value: 3to10, label: {fr: "De 3 à 10 ans", en: "3 to 10 years"}}
      - {value: gt10, label: {fr: "10 ans et plus", en: "10 years or more"}}
  - id: horizon.horizon_years
    type: number
    min: 0
    max: 60
    unit: {fr: "ans", en: "years"}
    weight: 6
    summary: true
    writable_by: [a1]
    label: {fr: "Années avant le premier retrait important", en: "Years before the first major withdrawal"}
    choices:
      # Tranches proposées par le code (numeric_choices) : seules celles incluses dans la bande horizon.horizon_band
      # déjà connue sont offertes, pour rester cohérent avec elle. Valeur écrite = borne basse (min), la plus
      # prudente. Les bornes sont un choix de l'implémentation, à relire par le volet finance.
      within: {field: horizon.horizon_band, ranges: {lt3: [0, 3], 3to10: [3, 10], gt10: [10, null]}}
      tranches:
        - {value: lt1, min: 0, max: 1, label: {fr: "Moins d'un an", en: "Less than a year"}}
        - {value: 1to2, min: 1, max: 2, label: {fr: "De 1 à moins de 2 ans", en: "1 to less than 2 years"}}
        - {value: 2to3, min: 2, max: 3, label: {fr: "De 2 à moins de 3 ans", en: "2 to less than 3 years"}}
        - {value: 3to5, min: 3, max: 5, label: {fr: "De 3 à moins de 5 ans", en: "3 to less than 5 years"}}
        - {value: 5to7, min: 5, max: 7, label: {fr: "De 5 à moins de 7 ans", en: "5 to less than 7 years"}}
        - {value: 7to10, min: 7, max: 10, label: {fr: "De 7 à moins de 10 ans", en: "7 to less than 10 years"}}
        - {value: 10to15, min: 10, max: 15, label: {fr: "De 10 à moins de 15 ans", en: "10 to less than 15 years"}}
        - {value: 15to20, min: 15, max: 20, label: {fr: "De 15 à moins de 20 ans", en: "15 to less than 20 years"}}
        - {value: 20to30, min: 20, max: 30, label: {fr: "De 20 à moins de 30 ans", en: "20 to less than 30 years"}}
        - {value: 30plus, min: 30, max: null, label: {fr: "30 ans ou plus", en: "30 years or more"}}
    fallback:
      kind: single_choice
      prompt: {fr: "Dans combien d'années environ prévoyez-vous le premier retrait important ?", en: "In about how many years do you expect the first major withdrawal?"}
      help: {fr: "Un ordre de grandeur suffit.", en: "A rough estimate is enough."}
  - id: horizon.withdrawal_pattern
    type: enum
    weight: 5
    summary: true
    writable_by: [a1]
    label: {fr: "Façon de retirer l'argent", en: "How the money will be withdrawn"}
    values:
      - {value: lump_sum, label: {fr: "En une seule fois", en: "All at once"}}
      - {value: gradual, label: {fr: "Par étapes, sur quelques années", en: "In stages, over a few years"}}
      - {value: regular_income, label: {fr: "Sous forme de revenu régulier", en: "As a regular income"}}
      - {value: undecided, label: {fr: "Pas encore décidé", en: "Not decided yet"}}
    fallback:
      kind: single_choice
      prompt: {fr: "Comment prévoyez-vous retirer cet argent le moment venu ?", en: "How do you plan to withdraw this money when the time comes?"}

  # ---------------------------------------------------------------- tolérance au risque
  - id: risk_tolerance.drop_reaction
    type: enum
    weight: 7
    writable_by: [base, a1]
    label: {fr: "Réaction à une baisse de 20 %", en: "Reaction to a 20% drop"}
    values:
      - {value: sell_all, label: {fr: "Tout vendre pour éviter de perdre davantage", en: "Sell everything to avoid further losses"}}
      - {value: sell_some, label: {fr: "Vendre une partie", en: "Sell part of it"}}
      - {value: hold, label: {fr: "Ne rien changer et attendre", en: "Change nothing and wait"}}
      - {value: buy_more, label: {fr: "En profiter pour investir davantage", en: "Take the opportunity to invest more"}}
  - id: risk_tolerance.risk_attitude
    type: enum
    weight: 5
    writable_by: [base, a1]
    label: {fr: "Attitude face aux variations", en: "Attitude towards fluctuations"}
    values:
      - {value: stability, label: {fr: "Éviter les baisses, même avec un rendement faible", en: "Avoid drops, even with a low return"}}
      - {value: small, label: {fr: "Accepter de petites variations", en: "Accept small fluctuations"}}
      - {value: moderate, label: {fr: "Accepter des variations moyennes", en: "Accept moderate fluctuations"}}
      - {value: large, label: {fr: "Accepter de fortes variations", en: "Accept large fluctuations"}}
  - id: risk_tolerance.past_drop_behavior
    type: enum
    weight: 5
    writable_by: [a1]
    label: {fr: "Comportement lors d'une baisse réelle", en: "Behaviour during a real market drop"}
    values:
      - {value: sold, label: {fr: "J'ai vendu", en: "I sold"}}
      - {value: held, label: {fr: "J'ai conservé mes placements", en: "I held on"}}
      - {value: bought_more, label: {fr: "J'ai investi davantage", en: "I invested more"}}
      - {value: never_experienced, label: {fr: "Je n'investissais pas encore", en: "I was not investing yet"}}
    fallback:
      kind: single_choice
      prompt: {fr: "Lors d'une baisse réelle des marchés, par exemple en 2022, qu'avez-vous fait ?", en: "During a real market drop, for example in 2022, what did you do?"}
  - id: risk_tolerance.sell_threshold_pct
    # Banque du Brain TR-03. Lu par l'étape 0 (faible sang-froid), hors du barème de la tolérance (rules.risk).
    type: enum
    weight: 0
    writable_by: [base, a1]
    label: {fr: "Baisse sur un an qui donnerait envie de vendre", en: "One-year drop that would make you want to sell"}
    values:
      - {value: none, label: {fr: "Aucune baisse acceptée", en: "No drop accepted"}}
      - {value: lt5, label: {fr: "Moins de 5 %", en: "Less than 5%"}}
      - {value: 5to10, label: {fr: "De 5 % à moins de 10 %", en: "5% to less than 10%"}}
      - {value: 10to20, label: {fr: "De 10 % à moins de 20 %", en: "10% to less than 20%"}}
      - {value: 20to30, label: {fr: "De 20 % à moins de 30 %", en: "20% to less than 30%"}}
      - {value: gte30, label: {fr: "30 % ou plus", en: "30% or more"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}

  # ---------------------------------------------------------------- capacité à prendre du risque
  - id: risk_capacity.emergency_fund
    type: number
    min: 0
    max: 120
    unit: {fr: "mois", en: "months"}
    weight: 6
    writable_by: [base, a1]
    label: {fr: "Fonds d'urgence", en: "Emergency fund"}
  - id: risk_capacity.income_stability
    type: enum
    weight: 5
    writable_by: [base, a1]
    label: {fr: "Stabilité des revenus", en: "Income stability"}
    values:
      - {value: very_stable, label: {fr: "Très stables", en: "Very stable"}}
      - {value: stable, label: {fr: "Plutôt stables", en: "Fairly stable"}}
      - {value: variable, label: {fr: "Variables ou incertains", en: "Variable or uncertain"}}
      - {value: none, label: {fr: "Pas de revenu régulier", en: "No regular income"}}
  - id: risk_capacity.employment_sector
    # Banque du Brain SF-12 (capital humain). Lu par l'étape 0 : un revenu qui suit un secteur plafonne ce
    # secteur (strategy.yaml, sectors.employment_to_tag). Le nom de l'employeur n'est jamais demandé.
    type: enum
    weight: 0
    writable_by: [base, a1]
    label: {fr: "Secteur d'emploi", en: "Employment sector"}
    values:
      - {value: technology, label: {fr: "Technologie", en: "Technology"}}
      - {value: finance, label: {fr: "Finance", en: "Finance"}}
      - {value: energy, label: {fr: "Énergie", en: "Energy"}}
      - {value: healthcare, label: {fr: "Santé", en: "Health care"}}
      - {value: public, label: {fr: "Secteur public", en: "Public sector"}}
      - {value: industry, label: {fr: "Industrie", en: "Industry"}}
      - {value: retail, label: {fr: "Commerce", en: "Retail"}}
      - {value: unemployed, label: {fr: "Sans emploi", en: "Not employed"}}
      - {value: prefer_not, label: {fr: "Préfère ne pas répondre", en: "Prefers not to answer"}}
  - id: risk_capacity.loss_impact
    type: enum
    weight: 6
    writable_by: [base, a1]
    label: {fr: "Effet d'une perte du quart de ce placement", en: "Effect of losing a quarter of this investment"}
    values:
      - {value: major, label: {fr: "Changer des projets importants", en: "Change major plans"}}
      - {value: some, label: {fr: "Quelques ajustements", en: "Some adjustments"}}
      - {value: none, label: {fr: "Aucun effet notable", en: "No noticeable effect"}}
  - id: risk_capacity.max_loss_cad
    type: money
    min: 0
    max: 100000000
    weight: 6
    writable_by: [a1]
    label: {fr: "Perte admissible", en: "Acceptable loss"}
    choices:
      # Tranches en dollars calculées par le code (numeric_choices) : 2,5, 5, 10, 20 et 30 % du montant
      # context.amount_cad (M), comme SF-04 de la banque du Brain, avec une tranche de plus sous 5 %.
      # Valeur écrite = borne basse de la tranche, la plus prudente (0 pour la première).
      relative_to: context.amount_cad
      shares: [0.025, 0.05, 0.10, 0.20, 0.30]
      # Tranches absolues, quand le montant est inconnu.
      tranches:
        - {value: lt1k, min: 0, max: 1000, label: {fr: "Moins de 1 000 $", en: "Less than $1,000"}}
        - {value: 1k_2500, min: 1000, max: 2500, label: {fr: "De 1 000 $ à moins de 2 500 $", en: "$1,000 to less than $2,500"}}
        - {value: 2500_5k, min: 2500, max: 5000, label: {fr: "De 2 500 $ à moins de 5 000 $", en: "$2,500 to less than $5,000"}}
        - {value: 5k_10k, min: 5000, max: 10000, label: {fr: "De 5 000 $ à moins de 10 000 $", en: "$5,000 to less than $10,000"}}
        - {value: 10k_25k, min: 10000, max: 25000, label: {fr: "De 10 000 $ à moins de 25 000 $", en: "$10,000 to less than $25,000"}}
        - {value: 25k_plus, min: 25000, max: null, label: {fr: "25 000 $ ou plus", en: "$25,000 or more"}}
    fallback:
      kind: single_choice
      prompt: {fr: "Quelle perte, en dollars, pourriez-vous absorber sur ce placement sans changer vos projets ?", en: "What loss, in dollars, could you absorb on this investment without changing your plans?"}
      help: {fr: "Il s'agit de votre capacité financière, pas de votre confort face aux baisses.", en: "This is about your financial capacity, not your comfort with drops."}
  - id: risk_capacity.high_interest_debt
    type: boolean
    weight: 4
    writable_by: [a1]
    label: {fr: "Dettes à taux d'intérêt élevé", en: "High-interest debt"}
    fallback:
      kind: boolean
      prompt: {fr: "Avez-vous des dettes à taux d'intérêt élevé, comme un solde de carte de crédit reporté d'un mois à l'autre ?", en: "Do you have high-interest debt, such as a credit card balance carried from month to month?"}

  # ---------------------------------------------------------------- contraintes
  - id: constraints.liquidity_need
    type: enum
    weight: 4
    summary: true
    writable_by: [base, a1]
    label: {fr: "Retraits prévus dans les 12 prochains mois", en: "Withdrawals planned in the next 12 months"}
    values:
      - {value: none, label: {fr: "Aucun retrait prévu sous 12 mois", en: "No withdrawal within 12 months"}}
      - {value: some, label: {fr: "Une petite partie sous 12 mois", en: "A small part within 12 months"}}
      - {value: large, label: {fr: "Une part importante sous 12 mois", en: "A large part within 12 months"}}
  - id: constraints.withdrawal_pct_12m
    type: percent
    min: 0
    max: 100
    weight: 2
    summary: true   # le résumé cite la tranche choisie (« de 10 % à moins de 25 % »), pas la borne haute retenue
    when: {field: constraints.liquidity_need, in: [some, large]}
    writable_by: [base, a1]
    label: {fr: "Part à retirer sous 12 mois", en: "Share to withdraw within 12 months"}
  - id: constraints.account_types
    type: multi_enum
    weight: 3
    summary: true
    exclusive: [unknown]
    writable_by: [base, a1, a2]
    label: {fr: "Types de comptes", en: "Account types"}
    values:
      - {value: tfsa, label: {fr: "CELI", en: "TFSA"}}
      - {value: rrsp, label: {fr: "REER", en: "RRSP"}}
      - {value: resp, label: {fr: "REEE", en: "RESP"}}
      - {value: rrif, label: {fr: "FERR", en: "RRIF"}}
      - {value: non_registered, label: {fr: "Compte non enregistré", en: "Non-registered account"}}
      - {value: unknown, label: {fr: "Pas encore décidé", en: "Not decided yet"}}
  - id: constraints.currency_preference
    type: enum
    weight: 2
    summary: true
    writable_by: [base, a1]
    label: {fr: "Préférence de devise", en: "Currency preference"}
    values:
      - {value: cad_only, label: {fr: "Surtout en dollars canadiens", en: "Mostly Canadian dollars"}}
      - {value: cad_usd, label: {fr: "Dollars canadiens et américains", en: "Canadian and US dollars"}}
      - {value: no_preference, label: {fr: "Aucune préférence de devise", en: "No currency preference"}}
  - id: constraints.monthly_contribution_cad
    type: money
    min: 0
    max: 1000000
    weight: 4
    writable_by: [a1]
    label: {fr: "Ajout mensuel prévu", en: "Planned monthly contribution"}
    choices:
      # Tranches absolues proposées par le code (numeric_choices). Valeur écrite = borne basse (min), la plus
      # prudente. Les bornes sont un choix de l'implémentation, à relire par le volet finance.
      tranches:
        - {value: none, min: 0, max: 0, label: {fr: "Aucun ajout", en: "No contribution"}}
        - {value: lt100, min: 0, max: 100, label: {fr: "Moins de 100 $ par mois", en: "Less than $100 a month"}}
        - {value: 100to250, min: 100, max: 250, label: {fr: "De 100 $ à moins de 250 $ par mois", en: "$100 to less than $250 a month"}}
        - {value: 250to500, min: 250, max: 500, label: {fr: "De 250 $ à moins de 500 $ par mois", en: "$250 to less than $500 a month"}}
        - {value: 500to1000, min: 500, max: 1000, label: {fr: "De 500 $ à moins de 1 000 $ par mois", en: "$500 to less than $1,000 a month"}}
        - {value: 1000to2500, min: 1000, max: 2500, label: {fr: "De 1 000 $ à moins de 2 500 $ par mois", en: "$1,000 to less than $2,500 a month"}}
        - {value: 2500plus, min: 2500, max: null, label: {fr: "2 500 $ ou plus par mois", en: "$2,500 or more a month"}}
    fallback:
      kind: single_choice
      prompt: {fr: "Prévoyez-vous ajouter de l'argent régulièrement ? Si oui, combien par mois environ ?", en: "Do you plan to add money regularly? If so, about how much per month?"}

  # ---------------------------------------------------------------- préférences
  - id: preferences.esg_importance
    type: scale
    min: 1
    max: 5
    weight: 3
    summary: true
    writable_by: [base, a1]
    label: {fr: "Importance des critères ESG", en: "Importance of ESG criteria"}
  - id: preferences.exclusions
    type: multi_enum
    weight: 2
    summary: true
    exclusive: [none]
    when: {field: preferences.esg_importance, gte: 3}
    writable_by: [base, a1]
    label: {fr: "Exclusions", en: "Exclusions"}
    values:
      - {value: tobacco, label: {fr: "Tabac", en: "Tobacco"}}
      - {value: weapons, label: {fr: "Armement", en: "Weapons"}}
      - {value: fossil_fuels, label: {fr: "Combustibles fossiles", en: "Fossil fuels"}}
      - {value: gambling, label: {fr: "Jeux de hasard", en: "Gambling"}}
      - {value: alcohol, label: {fr: "Alcool", en: "Alcohol"}}
      - {value: none, label: {fr: "Aucune exclusion", en: "No exclusion"}}
  - id: preferences.exclusion_strictness
    # Banque du Brain PR-04, une fois pour l'ensemble des exclusions. Lu par l'étape 0 (strategy.yaml,
    # profile_codes.exclusion_strictness). Applicable si les exclusions ne sont ni vides ni « aucune ».
    type: enum
    weight: 0
    when: {field: preferences.exclusions, not_in: [[], [none]]}
    writable_by: [base, a1]
    label: {fr: "Force des exclusions", en: "Strength of the exclusions"}
    values:
      - {value: absolute, label: {fr: "Limite absolue", en: "Absolute limit"}}
      - {value: small_share_in_fund, label: {fr: "Petite part tolérée dans un fonds", en: "Small share tolerated in a fund"}}
      - {value: preference, label: {fr: "Simple préférence", en: "Preference only"}}
      - {value: dont_know, label: {fr: "Je ne sais pas", en: "I don't know"}}
  - id: preferences.interests
    type: multi_enum
    weight: 2
    summary: true
    exclusive: [none]
    writable_by: [base, a1]
    label: {fr: "Thèmes d'intérêt", en: "Themes of interest"}
    values:
      - {value: technology, label: {fr: "Technologie et intelligence artificielle", en: "Technology and artificial intelligence"}}
