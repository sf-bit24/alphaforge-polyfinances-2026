      - {value: none, label: {fr: "Aucune en particulier", en: "None in particular"}}
  - id: preferences.approach
    type: enum
    weight: 4
    summary: true
    writable_by: [a1]
    label: {fr: "Façon d'investir préférée", en: "Preferred way of investing"}
    values:
      - {value: passive_funds, label: {fr: "Surtout des fonds indiciels (FNB)", en: "Mostly index funds (ETFs)"}}
      - {value: mixed, label: {fr: "Un mélange de fonds et de titres individuels", en: "A mix of funds and individual securities"}}
      - {value: individual_securities, label: {fr: "Surtout des titres individuels", en: "Mostly individual securities"}}
