[project]
name = "alphaforge-polyfinances-2026"
version = "0.1.0"
description = "Explainable agentic investment decision support monolith"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
