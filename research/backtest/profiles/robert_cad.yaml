# Robert - era 2 (Canadian retiree in CAD, 1977+). SIMULATION ONLY - not financial advice.
# Persona inputs (identity/RRTTLLU only): 59 y, horizon 3-5 y (central 4 y), low-to-moderate risk,
# preserve capital + moderate growth, established companies, no crypto. No number from the persona doc.
#
# Reference currency CAD, Canadian CPI. US assets are UNHEDGED (USDCAD month-end, data/SOURCES.md).
# Limiting asset: CA_EQ (1977-01). Canadian bond curve: only CA_TBILL (~3 m interbank, not an investable
# index) and CA_GOV_10Y (synthetic from OECD monthly-average yields -> volatility understated).
# Short/intermediate duration is therefore tested with US Treasuries converted to CAD (adds FX risk).
#
# Risk limits = the MOST CONSERVATIVE derived values (USD 1926+ era, H = 4 y): maxDD* 0.23, CVaR5* 0.036
# (analysis/robert/derive_thresholds.py -> results/robert_analysis/derive_thresholds.json).
# Rationale: loss capacity belongs to Robert, not to the era; the CAD era alone would allow 0.30 / 0.068
# (sensitivity file robert_cad_eralimits.yaml). PROPOSAL TO BE VALIDATED BY THE TEAM.

id: robert_cad
description: "Robert (59, horizon 4 y) - Canadian investor in CAD 1977+, CA + US (unhedged) proxies."
currency: CAD
fx_fill: none
horizon_years: 4
mode: non_overlapping
step_months: 12
period: {start: 1977-01, end: null}

universe: [CA_EQ, US_MKT, US_IND_NODUR, US_IND_UTILS, US_IND_HLTH, CA_GOV_10Y, UST_5Y, UST_2Y, GOLD, CA_TBILL]
cash_asset: CA_TBILL

objective:
  type: min_shortfall
  target_real_return: 0.0

constraints:
  default_bounds: [0.0, 1.0]
  exclude: {assets: [], tags: [crypto, speculative], classes: [crypto]}
  groups: []

risk_limits:
  max_vol: null
  max_drawdown: 0.23
  max_cvar_5: 0.036

flows: {initial: 1.0, monthly: 0.0, indexed_to_inflation: true}
rebalancing: {frequency: annual, band: 0.05}
costs_bps: 10
fallback_weights: {CA_EQ: 0.1, US_MKT: 0.1, CA_GOV_10Y: 0.6, CA_TBILL: 0.2}

strategies:
  - {name: cash_100, type: static, params: {weights: {CA_TBILL: 1.0}}}
  - {name: bonds_ca10y, type: static, params: {weights: {CA_GOV_10Y: 1.0}}}
  - {name: ladder_cash_ca10y, type: static, params: {weights: {CA_TBILL: 0.5, CA_GOV_10Y: 0.5}}}
  - {name: eq10_ca10y, type: static, params: {weights: {CA_EQ: 0.1, CA_GOV_10Y: 0.9}}}
  - {name: eq20_ca10y, type: static, params: {weights: {CA_EQ: 0.1, US_MKT: 0.1, CA_GOV_10Y: 0.8}}}
  - {name: eq20_cash_ca10y, type: static, params: {weights: {CA_EQ: 0.1, US_MKT: 0.1, CA_GOV_10Y: 0.4, CA_TBILL: 0.4}}}
  - {name: eq20_ust2y, type: static, params: {weights: {CA_EQ: 0.1, US_MKT: 0.1, UST_2Y: 0.4, CA_TBILL: 0.4}}}
  - {name: eq30_mix, type: static, params: {weights: {CA_EQ: 0.15, US_MKT: 0.15, CA_GOV_10Y: 0.5, CA_TBILL: 0.2}}}
  - {name: eq30_defensive, type: static,
     params: {weights: {CA_EQ: 0.1, US_IND_NODUR: 0.075, US_IND_UTILS: 0.05, US_IND_HLTH: 0.075, CA_GOV_10Y: 0.5, CA_TBILL: 0.2}}}
  - {name: eq20_gold10, type: static, params: {weights: {CA_EQ: 0.1, US_MKT: 0.1, GOLD: 0.1, CA_GOV_10Y: 0.5, CA_TBILL: 0.2}}}
  - {name: eq40_mix, type: static, params: {weights: {CA_EQ: 0.2, US_MKT: 0.2, CA_GOV_10Y: 0.6}}}
  - {name: sixty_forty, type: sixty_forty, params: {equity: [CA_EQ, US_MKT], bonds: [CA_GOV_10Y], equity_share: 0.6}}
  - name: glide_40_to_10
    type: glidepath
    params:
      start_weights: {CA_EQ: 0.2, US_MKT: 0.2, CA_GOV_10Y: 0.6}
      end_weights: {CA_EQ: 0.05, US_MKT: 0.05, CA_GOV_10Y: 0.4, CA_TBILL: 0.5}
  - {name: risk_parity_36m, type: risk_parity, params: {lookback: 36, method: inverse_vol, exclude: [CA_TBILL]}}
  - {name: min_variance_60m, type: min_variance, params: {lookback: 60}}
  - {name: mean_variance_60m, type: mean_variance, params: {lookback: 60, mu_shrink: 0.5, risk_aversion: 10}}
  - name: trend_40_mix
    type: trend_filter
    params: {ma_months: 10, base_weights: {CA_EQ: 0.2, US_MKT: 0.2, CA_GOV_10Y: 0.6}, always_hold: [CA_GOV_10Y]}
    rebalancing: {frequency: monthly}
  - name: trend_30_defensive
    type: trend_filter
    params: {ma_months: 10, base_weights: {CA_EQ: 0.1, US_IND_NODUR: 0.075, US_IND_UTILS: 0.05, US_IND_HLTH: 0.075, CA_GOV_10Y: 0.5, CA_TBILL: 0.2}, always_hold: [CA_GOV_10Y]}
    rebalancing: {frequency: monthly}
  - name: momentum_core_cash
    type: momentum
    params: {lookback: 12, top_k: 2, absolute: true, core_weights: {CA_TBILL: 0.5},
             candidates: [CA_EQ, US_MKT, US_IND_NODUR, US_IND_UTILS, US_IND_HLTH, CA_GOV_10Y, UST_5Y, GOLD]}
    rebalancing: {frequency: monthly}

selection:
  quantile: 0.10
  max_breach_rate: 0.10
  min_past_windows: 3

oracle: {enabled: true, n_starts: 6}
seed: 42
